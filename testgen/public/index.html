<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NWT-Testgenerator</title>
<style>
  :root{--or:#ED7D31;--pu:#7030A0;--ink:#1f2430;--line:#e3e6ec;--bg:#f6f7f9}
  *{box-sizing:border-box}
  body{font:16px/1.5 system-ui,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg);margin:0}
  .wrap{max-width:720px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px}
  .sub{color:#5a6475;margin:0 0 22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 1px 3px rgba(20,30,50,.05)}
  label{display:block;font-weight:600;margin:16px 0 6px}
  select,input[type=text],input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .row>div{flex:1;min-width:150px}
  .lvls{display:flex;gap:10px;margin-top:6px}
  .lvls label{display:flex;align-items:center;gap:7px;font-weight:500;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;flex:1;justify-content:center}
  .lvls input{accent-color:var(--pu)}
  .chk{display:flex;align-items:center;gap:9px;margin-top:16px;font-weight:500}
  button{margin-top:24px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--pu);color:#fff;font:600 17px/1 inherit;cursor:pointer}
  button:disabled{opacity:.6;cursor:wait}
  .hint{font-size:13px;color:#7a8191;margin-top:6px}
  .msg{margin-top:16px;padding:11px 14px;border-radius:9px;font-size:14px;display:none}
  .msg.ok{display:block;background:#eafaf0;color:#1c6b3c}
  .msg.err{display:block;background:#fdecec;color:#a42121}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:13px;color:#5a6475}
  .dot{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>NWT-Testgenerator</h1>
  <p class="sub">Erzeugt zwei komplementäre Gruppen in deiner Wdh-NWT-Vorlage – mit Lösungsblatt.</p>
  <div class="card">
    <label for="topic">Thema</label>
    <select id="topic"></select>

    <label>Schwierigkeit</label>
    <div class="lvls">
      <label><input type="checkbox" class="lv" value="L"> Leicht</label>
      <label><input type="checkbox" class="lv" value="M" checked> Mittel</label>
      <label><input type="checkbox" class="lv" value="S"> Schwer</label>
    </div>
    <p class="hint">Mehrere Stufen werden über die Beispiele hinweg abgewechselt.</p>

    <div class="row">
      <div>
        <label for="count">Anzahl Beispiele je Gruppe</label>
        <input type="number" id="count" min="1" max="30" value="4">
      </div>
      <div>
        <label for="month">Monat (Kopfzeile)</label>
        <input type="text" id="month" placeholder="11/2026">
      </div>
    </div>

    <label class="chk"><input type="checkbox" id="sol" checked> Lösungsblatt anhängen</label>

    <button id="go">Test erzeugen &amp; herunterladen</button>
    <div class="legend">
      <span><span class="dot" style="background:#ED7D31"></span>Gruppe 1</span>
      <span><span class="dot" style="background:#7030A0"></span>Gruppe 2</span>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>
<script>
const $ = s => document.querySelector(s);
let MONTH = '';
async function load(){
  const r = await fetch('/api/topics'); const d = await r.json();
  MONTH = d.month; $('#month').value = d.month;
  $('#topic').innerHTML = d.topics.map(t=>'<option value="'+t.id+'">'+t.label+'</option>').join('');
}
function msg(t,ok){ const m=$('#msg'); m.textContent=t; m.className='msg '+(ok?'ok':'err'); }
$('#go').addEventListener('click', async ()=>{
  const levels = [...document.querySelectorAll('.lv:checked')].map(c=>c.value);
  if(!levels.length){ msg('Bitte mindestens eine Schwierigkeit wählen.',false); return; }
  const body = { topic:$('#topic').value, levels, count:+$('#count').value,
                 month:$('#month').value||MONTH, withSolutions:$('#sol').checked };
  const btn=$('#go'); btn.disabled=true; msg('Erzeuge Test …',true);
  try{
    const r = await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){ const e=await r.json().catch(()=>({})); throw new Error(e.error||('HTTP '+r.status)); }
    const seed = r.headers.get('X-Seed');
    const blob = await r.blob();
    const cd = r.headers.get('Content-Disposition')||''; const fn=(cd.match(/filename="([^"]+)"/)||[])[1]||'Test.docx';
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fn; a.click();
    URL.revokeObjectURL(a.href);
    msg('Fertig: '+fn+'  (Seed '+seed+' – gleicher Seed = gleicher Test).',true);
  }catch(e){ msg('Fehler: '+e.message,false); }
  finally{ btn.disabled=false; }
});
load();
</script>
</body>
</html>
